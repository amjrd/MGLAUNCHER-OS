name: MGLAUNCHER-OS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Lawnchair APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MGLAUNCHER-OS
        uses: actions/checkout@v4

      - name: Checkout Lawnchair 16-dev
        uses: actions/checkout@v4
        with:
          repository: LawnchairLauncher/lawnchair
          ref: 16-dev
          path: lawnchair-src
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: lawnchair-src
        run: |
          chmod +x gradlew
          ./gradlew assembleLawnWithQuickstepGithubDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MGLAUNCHER-OS-APK
          path: lawnchair-src/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
